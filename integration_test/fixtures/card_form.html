<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
  <form id="synthetic-payment">
    <label>Card number <input id="card-number" autocomplete="cc-number"></label>
    <label>Expiry date <input id="card-expiry" autocomplete="cc-exp"></label>
    <label>Security code <input id="card-cvv" autocomplete="cc-csc"></label>
    <label>Name on card <input id="card-name" autocomplete="cc-name"></label>
    <label><input id="payment-terms" type="checkbox"> I agree to payment terms</label>
    <label><input id="save-card" type="checkbox"> Remember this card</label>
    <button id="pay" type="submit">Pay</button>
  </form>
</body>
</html>
